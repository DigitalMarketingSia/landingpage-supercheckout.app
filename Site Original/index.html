<!DOCTYPE html>
<html lang="pt-BR" class="scroll-smooth">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Super Checkout .app | Performance Imbatível</title>
  <link rel="icon" type="image/png" href="/logo.png" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Outfit', 'sans-serif'],
            heading: ['Montserrat', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,300;0,400;0,700;0,900;1,300;1,400;1,700;1,900&family=Outfit:wght@300;400;500;600;700;800;900&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --bg: #020205;
      --accent: #a855f7;
      --secondary: #22c55e;
    }

    .bg-grid-glow {
      position: fixed;
      inset: 0;
      z-index: 0;
      background: #020205;
      overflow: hidden;
      pointer-events: none;
    }
    .bg-glow-orb {
      position: absolute;
      width: 80vw;
      height: 80vw;
      max-width: 800px;
      max-height: 800px;
      border-radius: 50%;
      filter: blur(120px);
      pointer-events: none;
      opacity: 0.15;
      mix-blend-mode: screen;
    }
    .bg-glow-orb-1 {
      top: -20%;
      left: -10%;
      background: radial-gradient(circle, rgba(16, 185, 129, 0.6) 0%, transparent 70%);
      animation: pulse-glow-1 12s infinite alternate ease-in-out;
    }
    .bg-glow-orb-2 {
      bottom: -20%;
      right: -10%;
      background: radial-gradient(circle, rgba(16, 185, 129, 0.5) 0%, transparent 70%);
      animation: pulse-glow-2 15s infinite alternate ease-in-out;
    }
    .bg-glow-orb-3 {
      top: 40%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 60vw;
      height: 60vw;
      background: radial-gradient(circle, rgba(168, 85, 247, 0.25) 0%, transparent 70%);
      animation: pulse-glow-3 20s infinite alternate ease-in-out;
    }
    @keyframes pulse-glow-1 {
      0% { transform: scale(1) translate(0, 0); opacity: 0.12; }
      100% { transform: scale(1.2) translate(8%, 5%); opacity: 0.22; }
    }
    @keyframes pulse-glow-2 {
      0% { transform: scale(1) translate(0, 0); opacity: 0.1; }
      100% { transform: scale(1.15) translate(-5%, -8%); opacity: 0.2; }
    }
    @keyframes pulse-glow-3 {
      0% { transform: scale(0.9) translate(-50%, -50%); opacity: 0.05; }
      100% { transform: scale(1.1) translate(-40%, -45%); opacity: 0.15; }
    }

    html {
      scrollbar-width: none;
      /* Firefox */
      -ms-overflow-style: none;
      /* IE and Edge */
    }

    html::-webkit-scrollbar {
      display: none;
    }

    body {
      font-family: 'Outfit', sans-serif;
      background-color: var(--bg);
      color: #ffffff;
      margin: 0;
      overflow-x: hidden;
      /* Hide scrollbar but keep functionality */
      scrollbar-width: none;
      /* Firefox */
      -ms-overflow-style: none;
      /* IE and Edge */
    }

    /* Hide scrollbar for Chrome, Safari and Opera */
    body::-webkit-scrollbar {
      display: none;
    }

    h1,
    h2,
    h3,
    h4,
    h5,
    h6 {
      font-family: 'Montserrat', sans-serif;
    }

    .glass-card {
      background: rgba(255, 255, 255, 0.02);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 24px;
      position: relative;
      overflow: hidden;
    }

    .glass-card::before {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at top left, rgba(168, 85, 247, 0.1), transparent 40%);
      pointer-events: none;
    }

    .glow-border {
      position: relative;
    }

    .glow-border::after {
      content: "";
      position: absolute;
      inset: -1px;
      background: linear-gradient(45deg, transparent, rgba(168, 85, 247, 0.3), transparent);
      border-radius: inherit;
      z-index: -1;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .glow-border:hover::after {
      opacity: 1;
    }

    /* Custom Cursor elements (optional) */
    .bg-gradient-noise {
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3column%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
      opacity: 0.05;
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 50;
    }

    /* Mask for text reveal */
    .reveal-mask {
      clip-path: inset(0 0 100% 0);
      animation: reveal 1.2s cubic-bezier(0.77, 0, 0.175, 1) forwards;
    }

    @keyframes reveal {
      to {
        clip-path: inset(0 0 0 0);
      }
    }
  </style>
  <script type="importmap">
{
  "imports": {
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "framer-motion": "https://esm.sh/framer-motion@^12.26.1"
  }
}
</script>
  <link rel="stylesheet" href="/index.css">
</head>

<body>
  <div class="bg-gradient-noise"></div>
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>

</html>
